# Alternativa de laboratorio local; para el proyecto de escritorio el destino de nube es Aiven.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: biblioteca-mysql
spec:
  replicas: 1
  selector:
    matchLabels: { app: biblioteca-mysql }
  template:
    metadata:
      labels: { app: biblioteca-mysql }
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          env:
            - name: MYSQL_DATABASE
              value: biblioteca
            - name: MYSQL_USER
              valueFrom: { configMapKeyRef: { name: biblioteca-config, key: DB_USER } }
            - name: MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: biblioteca-secret, key: DB_PASSWORD } }
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: biblioteca-secret, key: DB_PASSWORD } }
          ports: [{ containerPort: 3306 }]
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "1Gi" }
          livenessProbe:
            exec: { command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"] }
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec: { command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"] }
            initialDelaySeconds: 10
            periodSeconds: 5
